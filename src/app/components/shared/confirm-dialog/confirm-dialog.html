@if (notificationService.confirmDialog$ | async; as dialog) {
  <!-- Apple Style Confirmation Dialog Overlay -->
  <div
    #backdrop
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 backdrop-blur-md bg-black/40 overflow-y-auto"
    (click)="cancel(dialog)"
  >
    <!-- Apple Dialog Card (Comfortably Centered) -->
    <div
      #dialogBox
      class="relative w-full max-w-sm bg-white/95 backdrop-blur-2xl rounded-3xl border border-black/[0.08] shadow-apple-lg p-6 sm:p-7 text-center transition-all duration-300 my-auto"
      (click)="$event.stopPropagation()"
    >
      <!-- Icon Container -->
      <div class="flex justify-center mb-4">
        <div
          class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-apple-sm"
          [ngClass]="{
            'bg-[#ff3b30]/10 text-[#ff3b30]': dialog.type === 'danger',
            'bg-[#f56300]/10 text-[#f56300]': dialog.type === 'warning',
            'bg-[#0071e3]/10 text-[#0071e3]': dialog.type === 'info' || !dialog.type
          }"
        >
          @if (dialog.type === 'danger') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          } @else if (dialog.type === 'warning') {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          }
        </div>
      </div>

      <!-- Title -->
      <h3 class="text-base sm:text-lg font-bold text-[#1d1d1f]">
        @if (dialog.type === 'danger') {
          ยืนยันการลบ
        } @else if (dialog.type === 'warning') {
          คำเตือน
        } @else {
          ยืนยันการทำรายการ
        }
      </h3>

      <!-- Message -->
      <p class="text-xs sm:text-sm text-[#6e6e73] leading-relaxed mt-2 mb-6">
        {{ dialog.message }}
      </p>

      <!-- Action Pill Buttons (Compact & Friendly) -->
      <div class="flex items-center gap-2.5 justify-center">
        <!-- Cancel Button -->
        <button
          type="button"
          (click)="cancel(dialog)"
          class="flex-1 px-4 py-2.5 rounded-full text-xs sm:text-sm font-semibold bg-[#f5f5f7] hover:bg-black/[0.06] text-[#1d1d1f] transition-all border border-black/[0.04] active:scale-[0.98]"
        >
          {{ dialog.cancelText || 'ยกเลิก' }}
        </button>

        <!-- Confirm Button -->
        <button
          type="button"
          (click)="confirm(dialog)"
          class="flex-1 px-4 py-2.5 rounded-full text-xs sm:text-sm font-semibold text-white transition-all shadow-apple-sm active:scale-[0.98]"
          [ngClass]="{
            'bg-[#ff3b30] hover:bg-[#d70015]': dialog.type === 'danger',
            'bg-[#f56300] hover:bg-[#d65300]': dialog.type === 'warning',
            'bg-[#0071e3] hover:bg-[#0077ed]': dialog.type === 'info' || !dialog.type
          }"
        >
          {{ dialog.confirmText || 'ยืนยัน' }}
        </button>
      </div>

    </div>
  </div>
}
