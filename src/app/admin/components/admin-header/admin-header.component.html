<!-- Apple macOS / iPadOS Pro Admin Top Bar: "เครื่องครัวแสงทอง" -->
<header class="h-16 bg-white/80 dark:bg-[#161617]/80 backdrop-blur-xl border-b border-black/[0.06] dark:border-white/[0.08] flex items-center justify-between px-4 sm:px-6 lg:px-8 relative z-30 transition-colors duration-200">

  <!-- Left: Sidebar Toggle, Brand & Search -->
  <div class="flex items-center gap-3 sm:gap-4 flex-1">
    <!-- Sidebar Toggle Button -->
    <button
      (click)="onToggleSidebar()"
      class="p-2 rounded-full text-[#1d1d1f] dark:text-[#f5f5f7] hover:bg-black/[0.05] dark:hover:bg-white/[0.1] transition-colors focus:outline-none"
      aria-label="เปิด/ปิดเมนูนำทาง"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Brand Identity (macOS App Title: "แสงทอง" Golden Light) -->
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#d97706] to-[#b45309] flex items-center justify-center text-white text-xs font-bold shadow-apple-gold">
        ERP
      </div>
      <div class="hidden sm:block">
        <h1 class="text-sm font-bold text-[#1d1d1f] dark:text-[#f5f5f7] tracking-tight leading-tight">เครื่องครัวแสงทอง &bull; ERP</h1>
        <p class="text-[11px] text-[#86868b] leading-tight">ระบบบริหารจัดการร้านและคลังสินค้า</p>
      </div>
    </div>

    <!-- Quick Search Input (Apple Style) -->
    <div class="hidden md:flex items-center flex-1 max-w-sm ml-4">
      <div class="relative w-full">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (focus)="onSearchFocus()"
          (blur)="onSearchBlur()"
          placeholder="ค้นหาข้อมูลในระบบ..."
          class="w-full pl-9 pr-4 py-1.5 bg-[#f5f5f7] dark:bg-[#2c2c2e] border border-transparent focus:border-[#d97706] dark:focus:border-[#fbbf24] focus:bg-white dark:focus:bg-[#1d1d1f] rounded-full text-xs font-medium text-[#1d1d1f] dark:text-[#f5f5f7] placeholder-[#86868b] outline-none transition-all"
        />
        <svg class="w-4 h-4 text-[#86868b] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>
  </div>

  <!-- Right: Actions, Theme Switcher, Storefront Link, Profile -->
  <div class="flex items-center gap-2 sm:gap-3">

    <!-- Theme Switcher Button (Apple Sun/Moon Toggle) -->
    <button
      (click)="toggleTheme()"
      class="p-2 rounded-full text-[#1d1d1f] dark:text-[#f5f5f7] hover:bg-black/[0.05] dark:hover:bg-white/[0.1] transition-all focus:outline-none"
      [attr.aria-label]="themeService.isDark() ? 'สลับเป็นโหมดสว่าง' : 'สลับเป็นโหมดมืด'"
      [title]="themeService.isDark() ? 'สลับเป็นโหมดสว่าง (Light Mode)' : 'สลับเป็นโหมดมืด (Dark Mode)'"
    >
      @if (themeService.isDark()) {
        <!-- Sun Icon -->
        <svg class="w-5 h-5 text-[#fbbf24] transition-transform duration-300 rotate-0 hover:rotate-45" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
      } @else {
        <!-- Moon Icon -->
        <svg class="w-5 h-5 text-[#6e6e73] transition-transform duration-300 -rotate-12 hover:rotate-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      }
    </button>

    <!-- Visit Storefront Pill Button -->
    <a
      routerLink="/"
      target="_blank"
      class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-[#1d1d1f] dark:text-[#f5f5f7] bg-[#f5f5f7] dark:bg-white/10 hover:bg-black/[0.06] dark:hover:bg-white/15 transition-all"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
      </svg>
      <span>หน้าร้าน</span>
    </a>

    <!-- Notifications Button -->
    <button
      class="p-2 rounded-full text-[#6e6e73] dark:text-[#86868b] hover:text-[#1d1d1f] dark:hover:text-[#f5f5f7] hover:bg-black/[0.05] dark:hover:bg-white/[0.1] transition-colors relative"
      aria-label="การแจ้งเตือน"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#d97706] dark:bg-[#fbbf24] rounded-full"></span>
    </button>

    <!-- User Profile Dropdown -->
    <div class="relative" #profileMenuRef>
      <button
        (click)="toggleProfileMenu()"
        class="flex items-center gap-2 p-1 pl-2 rounded-full hover:bg-black/[0.05] dark:hover:bg-white/[0.1] transition-all focus:outline-none"
        aria-label="โปรไฟล์ผู้ดูแลระบบ"
      >
        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-[#d97706] to-[#b45309] text-white flex items-center justify-center text-xs font-bold shadow-apple-sm">
          {{ getUserInitials() }}
        </div>
        <div class="hidden lg:block text-left pr-1">
          <p class="text-xs font-bold text-[#1d1d1f] dark:text-[#f5f5f7] leading-tight truncate max-w-[100px]">
            {{ currentEmployee?.fullName || 'ผู้ดูแลระบบ' }}
          </p>
          <p class="text-[10px] text-[#86868b] leading-tight truncate">
            {{ currentEmployee?.role || 'Admin' }}
          </p>
        </div>
        <svg class="w-3.5 h-3.5 text-[#86868b] transition-transform duration-200" [class.rotate-180]="isProfileMenuOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <!-- Apple Floating Profile Menu -->
      @if (isProfileMenuOpen) {
        <div class="absolute right-0 mt-2 w-64 bg-white/95 dark:bg-[#1d1d1f]/95 backdrop-blur-2xl rounded-2xl shadow-apple-lg border border-black/[0.08] dark:border-white/[0.1] p-2 z-50 animate-apple-scale">
          <div class="px-3 py-2.5 border-b border-black/[0.06] dark:border-white/[0.08]">
            <p class="text-xs text-[#86868b]">เข้าสู่ระบบในชื่อ</p>
            <p class="text-sm font-bold text-[#1d1d1f] dark:text-[#f5f5f7] truncate">
              {{ currentEmployee?.fullName }}
            </p>
            <p class="text-xs text-[#86868b] truncate">
              {{ currentEmployee?.email }}
            </p>
          </div>

          <div class="py-1 space-y-0.5">
            <a
              routerLink="/admin/employees/profile"
              (click)="closeProfileMenu()"
              class="flex items-center gap-2.5 px-3 py-2 text-xs font-semibold text-[#1d1d1f] dark:text-[#f5f5f7] rounded-xl hover:bg-[#f5f5f7] dark:hover:bg-white/[0.06] transition-colors"
            >
              <svg class="w-4 h-4 text-[#86868b]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <span>ข้อมูลส่วนตัว</span>
            </a>

            <button
              (click)="toggleTheme(); closeProfileMenu()"
              class="w-full flex items-center justify-between px-3 py-2 text-xs font-semibold text-[#1d1d1f] dark:text-[#f5f5f7] rounded-xl hover:bg-[#f5f5f7] dark:hover:bg-white/[0.06] transition-colors"
            >
              <div class="flex items-center gap-2.5">
                <svg class="w-4 h-4 text-[#86868b]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <span>สลับโหมด Dark / Light</span>
              </div>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-black/[0.05] dark:bg-white/10 text-[#86868b]">
                {{ themeService.isDark() ? 'Dark' : 'Light' }}
              </span>
            </button>
          </div>

          <div class="pt-1 border-t border-black/[0.06] dark:border-white/[0.08]">
            <button
              (click)="logout()"
              class="w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold text-[#ff3b30] rounded-xl hover:bg-[#ff3b30]/10 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
              <span>ออกจากระบบ</span>
            </button>
          </div>
        </div>
      }
    </div>

  </div>

</header>
