<header #headerRef class="admin-header h-14 sm:h-16 md:h-20 flex items-center justify-between px-3 sm:px-4 md:px-6 lg:px-8 relative">
  <!-- Gradient Background -->
  <div class="absolute inset-0 bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900"></div>
  <div class="absolute inset-0 bg-gradient-to-br from-blue-500/20 via-transparent to-orange-500/20"></div>

  <!-- Glass Morphism Overlay -->
  <div class="absolute inset-0 backdrop-blur-sm bg-white/5"></div>

  <!-- Content -->
  <div class="relative z-10 flex items-center justify-between w-full">
    <!-- Left Section: Menu Toggle & Search -->
    <div class="flex items-center gap-2 sm:gap-3 md:gap-4 flex-1">
      <!-- Menu Toggle Button -->
      <button
        #menuToggleRef
        (click)="onToggleSidebar()"
        class="menu-toggle p-2 sm:p-2.5 md:p-3 rounded-xl md:rounded-2xl hover:bg-white/10 transition-all duration-300 group"
        aria-label="Toggle menu">
        <svg class="w-5 h-5 md:w-6 md:h-6 text-white group-hover:text-blue-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <!-- Brand Title -->
      <div class="hidden lg:flex items-center gap-3">
        <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl md:rounded-2xl bg-gradient-to-br from-blue-400 to-orange-500 flex items-center justify-center shadow-lg shadow-purple-500/50">
          <svg class="w-5 h-5 md:w-6 md:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-base md:text-lg font-bold text-white">ร้านเครื่องครัวแสงทอง/ใจกล้า</h1>
          <p class="text-xs text-gray-300">ระบบจัดการร้าน</p>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="hidden lg:flex items-center flex-1 max-w-md ml-4 md:ml-8">
        <div class="search-container relative w-full group">
          <input
            #searchRef
            type="text"
            [(ngModel)]="searchQuery"
            (focus)="onSearchFocus()"
            (blur)="onSearchBlur()"
            placeholder="ค้นหา..."
            class="w-full px-4 md:px-5 py-2 md:py-2.5 pl-10 md:pl-12 bg-white/10 border border-white/20 rounded-xl md:rounded-2xl text-sm md:text-base text-white placeholder-gray-400 focus:outline-none focus:bg-white/15 focus:border-blue-500/50 transition-all duration-300">
          <svg class="w-4 h-4 md:w-5 md:h-5 absolute left-3 md:left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Right Section: Actions & User -->
    <div class="flex items-center gap-1.5 sm:gap-2 md:gap-3">
      <!-- Back to Site Button -->
      <a
        #backButtonRef
        routerLink="/"
        class="back-btn hidden md:flex items-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-white/10 hover:bg-white/15 border border-white/20 rounded-xl md:rounded-2xl text-white text-xs md:text-sm font-medium transition-all duration-300 hover:shadow-lg hover:shadow-purple-500/20">
        <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span class="hidden lg:inline">กลับสู่เว็บไซต์</span>
      </a>

      <!-- Notifications -->
      <button
        #notificationRef
        (click)="toggleNotifications()"
        class="notification-btn relative p-2 sm:p-2.5 md:p-3 rounded-xl md:rounded-2xl hover:bg-white/10 transition-all duration-300 group">
        <svg class="w-5 h-5 md:w-6 md:h-6 text-white group-hover:text-blue-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        @if (notificationCount > 0) {
          <span class="absolute -top-0.5 -right-0.5 md:-top-1 md:-right-1 w-4 h-4 md:w-5 md:h-5 bg-gradient-to-br from-pink-500 to-orange-500 rounded-full flex items-center justify-center text-[10px] md:text-xs font-bold text-white shadow-lg shadow-pink-500/50">
            {{ notificationCount }}
          </span>
        }
      </button>

      <!-- User Dropdown -->
      <div class="relative" #userMenuRef>
        <button
          (click)="toggleUserMenu()"
          class="user-menu-toggle flex items-center gap-2 md:gap-3 px-2 md:px-3 py-1.5 md:py-2 rounded-xl md:rounded-2xl hover:bg-white/10 transition-all duration-300 group">
          <!-- Avatar -->
          <div class="w-8 h-8 md:w-10 md:h-10 rounded-xl md:rounded-2xl bg-gradient-to-br from-blue-400 to-blue-500 flex items-center justify-center shadow-lg shadow-purple-500/30 ring-2 ring-white/20 group-hover:ring-purple-400/50 transition-all">
            <span class="text-white font-bold text-xs md:text-sm">
              {{ userName.charAt(0).toUpperCase() }}
            </span>
          </div>
          <!-- User Info (Desktop) -->
          <div class="hidden xl:block text-left">
            <p class="font-semibold text-white text-sm">{{ userName }}</p>
            <p class="text-xs text-gray-300">{{ userRole }}</p>
          </div>
          <!-- Dropdown Icon -->
          <svg class="w-4 h-4 md:w-5 md:h-5 text-white group-hover:text-blue-300 transition-all duration-300 hidden sm:block" [class.rotate-180]="isUserMenuOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        @if (isUserMenuOpen()) {
          <div #dropdownRef class="user-dropdown absolute right-0 mt-2 md:mt-3 w-56 md:w-64 bg-gray-800/95 backdrop-blur-xl border border-white/10 rounded-xl md:rounded-2xl shadow-2xl shadow-black/50 overflow-hidden">
            <!-- User Info Section -->
            <div class="p-4 border-b border-white/10 bg-gradient-to-br from-blue-500/20 to-orange-500/20">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-400 to-blue-500 flex items-center justify-center shadow-lg">
                  <span class="text-white font-bold">
                    {{ userName.charAt(0).toUpperCase() }}
                  </span>
                </div>
                <div>
                  <p class="font-semibold text-white">{{ userName }}</p>
                  <p class="text-xs text-gray-300">{{ userRole }}</p>
                </div>
              </div>
            </div>

            <!-- Menu Items -->
            <div class="p-2">
              <a routerLink="/profile" class="dropdown-item w-full flex items-center gap-3 px-4 py-3 text-white hover:bg-white/10 rounded-xl transition-all duration-200 group">
                <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span class="text-sm">โปรไฟล์</span>
              </a>

              <a routerLink="/admin/settings" class="dropdown-item w-full flex items-center gap-3 px-4 py-3 text-white hover:bg-white/10 rounded-xl transition-all duration-200 group">
                <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="text-sm">ตั้งค่า</span>
              </a>

              <div class="h-px bg-white/10 my-2"></div>

              <button
                (click)="logout()"
                class="dropdown-item w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-500/10 rounded-xl transition-all duration-200 group">
                <svg class="w-5 h-5 group-hover:text-red-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                <span class="text-sm font-medium">ออกจากระบบ</span>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
