  <meta name="theme-color" content="#f5f5f7">

  <!-- Anti-FOUC & Anti-Flicker Theme Script -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('apple_theme');
        var isDark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.style.backgroundColor = '#161617';
        } else {
          root.classList.remove('dark');
          root.style.backgroundColor = '#f5f5f7';
        }
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() { root.classList.remove('preload'); }, 80);
        });
      } catch (e) {}
    })();
  </script>
